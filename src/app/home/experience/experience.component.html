<section class="experience" id="experience">
  <div class="container">
    <p class="tag" appReveal>// experiência</p>

    <div class="timeline">
      @for (item of roles; track item.role + item.period) {
        <div class="item" appReveal>
          <div class="dot"></div>
          <div class="card">
            <div class="head">
              <h3>{{ item.role }}</h3>
              <span class="period">{{ item.period }}</span>
            </div>
            <p class="company">{{ item.company }}</p>
            <ul>
              @for (bullet of item.bullets; track bullet) {
                <li>{{ bullet }}</li>
              }
            </ul>
          </div>
        </div>
      }
    </div>
  </div>
</section>
